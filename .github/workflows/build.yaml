name: build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install nerdctl
        run: |
          sudo apt-get update
          sudo apt-get install -y containerd
          curl -L https://github.com/containerd/nerdctl/releases/download/v1.7.4/nerdctl-1.7.4-linux-amd64.tar.gz | tar xz
          sudo mv nerdctl /usr/local/bin/
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4'
          check-latest: true
      - run: go version
      - name: Run build
        run: make clean build
      - name: Run test
        env:
          RUN_INTEGRATION: "1"
        run: make test test.integration
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Docker build base
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          build-args: |
            MAKE_TARGET=test build
      - name: Docker build all
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          build-args: |
            MAKE_TARGET=all
